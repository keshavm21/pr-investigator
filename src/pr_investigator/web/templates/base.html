<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Review{% endblock %} · PR Investigator</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><span class="logo"></span>PR Investigator</a>
    {% if csrf %}
    <nav class="nav"><a href="/" class="{% if active == 'runs' %}active{% endif %}">Runs</a></nav>
    <span class="spacer"></span>
    <form method="post" action="/logout" style="margin:0">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="btn btn-ghost btn-sm">Sign out</button>
    </form>
    {% endif %}
  </div>
</header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
