[project]
name = "pr-investigator"
version = "0.1.0"
description = "Evidence-driven AI reviewer for GitHub pull requests"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=1.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
pri = "pr_investigator.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_investigator"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["evals/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# conftest checks the install before importing the package, so its imports come later.
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Only the repo root, so tests can import tests.support. The package itself must come from
# the installed (editable) project, never from src/ on sys.path: that would hide install bugs.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls a real LLM API (skipped unless PRI_LIVE_TESTS=1)"]
addopts = "-ra"
