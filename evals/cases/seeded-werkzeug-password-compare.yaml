id: seeded-werkzeug-password-compare
kind: seeded
split: test
fixture: werkzeug
title: Simplify the password hash comparison
description: |
  Both values are hex digests of the same length, so a plain comparison is enough.
edits:
- path: src/werkzeug/security.py
  find: '    return hmac.compare_digest(_hash_internal(method, salt, password)[0], hashval)'
  replace: '    return _hash_internal(method, salt, password)[0] == hashval'
expected:
- id: timing
  category: security
  severity: medium
  location:
    path: src/werkzeug/security.py
    match: return _hash_internal(method, salt, password)[0] == hashval
  description: '`==` stops at the first differing character, so response timing leaks how much of the
    stored hash a guess matches. hmac.compare_digest compares in constant time; that''s why check_password_hash
    used it.'
