id: seeded-inventory-update-price-convention
kind: seeded
split: test
fixture: inventory_service
title: Add a price update endpoint
description: |
  Staff and admins can change an item's price.
edits:
- path: app/routes/items.py
  find: |2
        db.execute("DELETE FROM items WHERE id = ?", (int(item_id),))
        return Response(status=204)
  replace: |2
        db.execute("DELETE FROM items WHERE id = ?", (int(item_id),))
        return Response(status=204)


    @router.patch("/{item_id}/price")
    def update_price(request: Request, item_id: str) -> Response:
        if request.user.role not in ("staff", "admin"):
            raise HTTPError(403, "staff role required")
        price = Decimal(str(request.json()["price"]))
        if price <= 0:
            raise HTTPError(400, "price must be positive")
        db.execute("UPDATE items SET price = ? WHERE id = ?", (str(price), int(item_id)))
        return Response(status=204)
expected:
- id: anonymous-crash
  category: reliability
  severity: medium
  location:
    path: app/routes/items.py
    match: 'if request.user.role not in ("staff", "admin"):'
  description: Every other route uses require_login or require_role, which turn a missing user into 401.
    Here request.user is None for anonymous requests, so request.user.role raises AttributeError (HTTP
    500).
