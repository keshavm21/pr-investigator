id: decoy-allowlisted-sort
kind: decoy
title: Allow sorting the item list
description: |
  Adds an optional sort parameter (name, price or newest) to GET /items.
edits:
  - path: app/routes/items.py
    find: |
      from app.validators import parse_offset, parse_positive_int
    replace: |
      from app.validators import parse_offset, parse_positive_int, validate_sort_column
  - path: app/routes/items.py
    find: |
      def list_items(request: Request) -> Response:
          limit = parse_positive_int(request.query.get("limit"), default=20, maximum=100)
          offset = parse_offset(request.query.get("offset"))
          rows = db.query(
              "SELECT id, name, price, quantity FROM items ORDER BY name LIMIT ? OFFSET ?",
              (limit, offset),
          )
    replace: |
      def list_items(request: Request) -> Response:
          limit = parse_positive_int(request.query.get("limit"), default=20, maximum=100)
          offset = parse_offset(request.query.get("offset"))
          sort_column = validate_sort_column(request.query.get("sort", "name"))
          rows = db.query(
              f"SELECT id, name, price, quantity FROM items ORDER BY {sort_column} LIMIT ? OFFSET ?",
              (limit, offset),
          )
must_not_flag:
  - location:
      path: app/routes/items.py
      match: "ORDER BY {sort_column}"
    reason: >
      sort_column comes from validate_sort_column, which only returns values from the
      SORTABLE_COLUMNS allowlist in app/validators.py and raises HTTPError for anything else.
      Column names can't be bound as SQL parameters, so an allowlist is the correct approach.
