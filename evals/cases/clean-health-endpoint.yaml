id: clean-health-endpoint
kind: clean
title: Add health check endpoint
description: |
  The load balancer needs an unauthenticated liveness probe.
  Returns 503 without details if the database is unreachable.
edits:
  - path: app/routes/health.py
    create: |
      """Liveness probe for the load balancer. Intentionally unauthenticated."""

      from __future__ import annotations

      import logging
      import sqlite3

      from app.db import db
      from app.web import Request, Response, Router

      logger = logging.getLogger(__name__)
      router = Router(prefix="/health")


      @router.get("")
      def health(request: Request) -> Response:
          try:
              db.query_one("SELECT 1")
          except sqlite3.Error:
              logger.exception("health check: database unavailable")
              return Response.json({"status": "unavailable"}, status=503)
          return Response.json({"status": "ok"})
  - path: app/main.py
    find: |
      from app.routes import admin, exports, items, orders

      ROUTERS = [items.router, orders.router, admin.router, exports.router]
    replace: |
      from app.routes import admin, exports, health, items, orders

      ROUTERS = [items.router, orders.router, admin.router, exports.router, health.router]
